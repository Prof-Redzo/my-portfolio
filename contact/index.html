<!DOCTYPE html><html lang="en" class="antialiased"> <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact - Redžo Efendić</title><meta name="description" content="Get in touch with me"><link rel="icon" href="/my-portfolio/favicon.png"><link rel="stylesheet" href="/my-portfolio/_astro/about.C4niNvzE.css"></head> <body class="bg-blue-100 text-slate-900 dark:bg-slate-900 dark:text-slate-100"> <header class="max-w-5xl mx-auto px-4 py-6 flex items-center justify-between"> <a href="/my-portfolio/" class="font-semibold text-lg">Home</a> <nav class="flex gap-4 text-sm items-center"> <a href="/my-portfolio/projects" class="font-semibold text-lg">Projects</a> <a href="/my-portfolio/contact" class="font-semibold text-lg">Contact</a> <a href="/my-portfolio/about" class="font-semibold text-lg">About Me</a>  </nav> </header> <main class="max-w-5xl mx-auto px-4 pb-16">  <section class="py-16 max-w-xl mx-auto"> <h1 class="text-3xl font-bold mb-6 text-center">Get in Touch</h1> <p class="text-center opacity-80 mb-8">
Fill out the form below and I’ll get back to you soon.
</p> <form action="https://formsubmit.co/efendicredzo4@gmail.com" method="POST" class="space-y-4"> <input type="hidden" name="_captcha" value="false"> <div> <label for="name" class="block text-sm font-medium mb-1">Name</label> <input type="text" id="name" name="name" required class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"> </div> <div> <label for="email" class="block text-sm font-medium mb-1">Email</label> <input type="email" id="email" name="email" required class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"> </div> <div> <label for="message" class="block text-sm font-medium mb-1">Message</label> <textarea id="message" name="message" rows="5" required class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea> </div> <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition">
Send Message
</button> </form> <p id="form-status" class="mt-4 text-center"></p> </section> <script>
    window.addEventListener("DOMContentLoaded", () => {
      const form = document.querySelector("form");
      const statusBox = document.getElementById("form-status");

      if (!form || !statusBox) return;

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const data = new FormData(form);

        try {
          const res = await fetch(form.action, {
            method: "POST",
            body: data,
          });

          if (res.ok) {
            statusBox.textContent = "✅ Your message has been sent!";
            statusBox.className = "mt-4 text-center text-green-600";
            form.reset();
          } else {
            statusBox.textContent = "❌ Something went wrong. Please try again.";
            statusBox.className = "mt-4 text-center text-red-600";
          }
        } catch (err) {
          statusBox.textContent = "⚠️ Network error. Please try again later.";
          statusBox.className = "mt-4 text-center text-red-600";
        }
      });
    });
  </script>  </main> <footer class="max-w-5xl mx-auto px-4 py-10 text-sm opacity-70">
